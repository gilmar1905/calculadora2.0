<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção - Múltipla Inclusa</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
        input { padding: 10px; border: 1px solid #444; border-radius: 4px; background: #2a2a2a; color: white; width: 100%; margin-bottom: 10px; }
        .result-box { padding: 12px; background: #263238; border-left: 4px solid #4caf50; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Dados do Ciclo</h3>
    <label>Valor da Múltipla (R$):</label>
    <input type="number" id="valMultipla" value="100.00" oninput="calcular()">
    <label>Margem de Lucro (%):</label>
    <input type="number" id="margemLucro" value="10" oninput="calcular()">
</div>

<div class="card">
    <h3>Jogo 3 (O último)</h3>
    <input type="number" id="oddE_3" value="12.11" oninput="calcular()" placeholder="Odd Empate">
    <input type="number" id="oddV_3" value="20.65" oninput="calcular()" placeholder="Odd Visitante">
</div>

<div class="card">
    <h3>Jogo 2</h3>
    <input type="number" id="oddE_2" value="4.05" oninput="calcular()" placeholder="Odd Empate">
    <input type="number" id="oddV_2" value="6.10" oninput="calcular()" placeholder="Odd Visitante">
</div>

<div class="card">
    <h3>Jogo 1</h3>
    <input type="number" id="oddE_1" value="3.85" oninput="calcular()" placeholder="Odd Empate">
    <input type="number" id="oddV_1" value="5.80" oninput="calcular()" placeholder="Odd Visitante">
</div>

<div id="resultados"></div>

<script>
    function calcular() {
        let valM = parseFloat(document.getElementById('valMultipla').value) || 0;
        let margem = parseFloat(document.getElementById('margemLucro').value) / 100 || 0;

        let odds = [
            { e: parseFloat(document.getElementById('oddE_1').value), v: parseFloat(document.getElementById('oddV_1').value) },
            { e: parseFloat(document.getElementById('oddE_2').value), v: parseFloat(document.getElementById('oddV_2').value) },
            { e: parseFloat(document.getElementById('oddE_3').value), v: parseFloat(document.getElementById('oddV_3').value) }
        ];

        // O segredo está aqui: o custo base começa com o valor da múltipla.
        // O loop agora trata a múltipla como uma dívida inicial que precisa ser paga.
        let custoAcumulado = valM;
        let apostas = [];

        for (let i = 2; i >= 0; i--) {
            // A meta de recuperação agora engloba tudo o que já foi gasto (Múltipla + Proteções anteriores)
            let totalParaRecuperar = custoAcumulado * (1 + margem);
            
            // Cálculo da divisão proporcional nas odds
            let valE = (totalParaRecuperar / odds[i].e) / 2;
            let valV = (totalParaRecuperar / odds[i].v) / 2;
            
            apostas[i] = { e: valE, v: valV };
            
            // O custo acumulado cresce a cada passo, incluindo a Múltipla inicial
            custoAcumulado += (valE + valV);
        }

        let html = "";
        let custoCorrente = valM;
        for (let i = 0; i < 3; i++) {
            html += `<div class='result-box'><strong>Jogo ${i+1}:</strong><br>
                     Aposta Empate: R$ ${apostas[i].e.toFixed(2)} | Aposta Visitante: R$ ${apostas[i].v.toFixed(2)}<br>
                     Custo Acumulado Total no momento: R$ ${custoCorrente.toFixed(2)}</div>`;
            custoCorrente += (apostas[i].e + apostas[i].v);
        }
        document.getElementById('resultados').innerHTML = html;
    }
    window.onload = calcular;
</script>
</body>
</html>
