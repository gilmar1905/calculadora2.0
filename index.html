<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Proteção em Cascata</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h2 { margin-top: 0; color: var(--accent); font-size: 1.2rem; }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .full-width { grid-column: span 2; }

        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #94a3b8; }

        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-calc { background: var(--accent); color: white; }
        .btn-save { background: var(--success); color: white; margin-top: 10px; }
        
        .audit-box {
            margin-top: 15px;
            padding: 15px;
            background: #00000040;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .audit-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .prova-real { color: var(--success); font-weight: bold; border-top: 1px solid #334155; padding-top: 5px; }

        .summary { text-align: center; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Configurações Principais</h2>
        <div class="input-group">
            <div>
                <label>Montante Principal (R$)</label>
                <input type="number" id="montante" placeholder="Ex: 100" step="0.01">
            </div>
            <div>
                <label>Odd da Múltipla</label>
                <input type="number" id="oddPrincipal" placeholder="Ex: 5.50" step="0.01">
            </div>
            <div class="full-width">
                <label>Meta de Lucro Extra (R$)</label>
                <input type="number" id="metaExtra" placeholder="Ex: 5" value="0">
            </div>
        </div>
        <button class="btn-calc" onclick="calcularTudo()">CALCULAR ESTRATÉGIA</button>
        <button class="btn-save" onclick="salvarLocal()">SALVAR APOSTA</button>
    </div>

    <!-- Jogo 1 e Jogo 3 são feitos no Dia 1 conforme PDF -->
    <div id="cards-container">
        <!-- JS irá renderizar os cards J3, J1 e J2 aqui -->
    </div>

    <div class="card summary" id="resumo-final" style="display:none;">
        Custo Total da Operação: R$ <span id="total-geral">0.00</span>
    </div>
</div>

<script>
    // Ordem solicitada no PDF: J3, J1 e J2
    const jogos = [
        { id: 3, label: 'Jogo 03 (Proteção Múltipla Dia 1)' },
        { id: 1, label: 'Jogo 01 (Proteção Dia 1)' },
        { id: 2, label: 'Jogo 02 (Proteção Dia 2)' }
    ];

    function renderizarCards() {
        const container = document.getElementById('cards-container');
        jogos.forEach(j => {
            container.innerHTML += `
                <div class="card" id="card-j${j.id}">
                    <h2>${j.label}</h2>
                    <input type="text" id="times-j${j.id}" placeholder="Nomes dos Times" style="margin-bottom:10px">
                    <div class="input-group">
                        <div>
                            <label>Odd Empate</label>
                            <input type="number" id="oddE-j${j.id}" placeholder="Ex: 3.40" step="0.01">
                        </div>
                        <div>
                            <label>Odd Visitante</label>
                            <input type="number" id="oddV-j${j.id}" placeholder="Ex: 4.50" step="0.01">
                        </div>
                    </div>
                    <div id="audit-j${j.id}" class="audit-box" style="display:none"></div>
                </div>
            `;
        });
    }

    function calcularTudo() {
        const montanteP = parseFloat(document.getElementById('montante').value) || 0;
        const meta = parseFloat(document.getElementById('metaExtra').value) || 0;
        
        let custoAcumulado = montanteP;

        // Lógica de Proteção em Cascata
        // Para cada proteção (Empate e Visitante), precisamos que o retorno cubra (Custo + Meta)
        // Fórmula de Dutching aplicada: Stake = (Custo + Meta) / (Odd - 1) se considerarmos lucro líquido,
        // mas o PDF pede Retorno cobrindo custo acumulado + própria aposta + meta.
        
        jogos.forEach(j => {
            const oddE = parseFloat(document.getElementById(`oddE-j${j.id}`).value) || 0;
            const oddV = parseFloat(document.getElementById(`oddV-j${j.id}`).value) || 0;

            if(oddE > 1 && oddV > 1) {
                // Cálculo para cobrir custo acumulado + meta em qualquer um dos dois resultados
                // R = (Custo + Meta) / (1 - 1/oddE - 1/oddV)
                const retornoNecessario = (custoAcumulado + meta) / (1 - (1/oddE) - (1/oddV));
                const stakeE = retornoNecessario / oddE;
                const stakeV = retornoNecessario / oddV;
                const custoProtecao = stakeE + stakeV;

                document.getElementById(`audit-j${j.id}`).style.display = 'block';
                document.getElementById(`audit-j${j.id}`).innerHTML = `
                    <div class="audit-item"><span>Custo Anterior:</span> <span>R$ ${custoAcumulado.toFixed(2)}</span></div>
                    <div class="audit-item"><span>Aposta Empate:</span> <span>R$ ${stakeE.toFixed(2)}</span></div>
                    <div class="audit-item"><span>Aposta Visitante:</span> <span>R$ ${stakeV.toFixed(2)}</span></div>
                    <div class="audit-item"><span>Retorno Bruto:</span> <span>R$ ${retornoNecessario.toFixed(2)}</span></div>
                    <div class="audit-item prova-real"><span>Prova Real (Lucro):</span> <span>R$ ${(retornoNecessario - custoAcumulado - custoProtecao).toFixed(2)}</span></div>
                `;
                
                custoAcumulado += custoProtecao;
            }
        });

        document.getElementById('resumo-final').style.display = 'block';
        document.getElementById('total-geral').innerText = custoAcumulado.toFixed(2);
    }

    // Funcionalidade de LocalStorage (Fonte 95, 96)
    function salvarLocal() {
        const dados = {
            montante: document.getElementById('montante').value,
            oddP: document.getElementById('oddPrincipal').value,
            meta: document.getElementById('metaExtra').value,
            times: gamesData()
        };
        localStorage.setItem('minhaAposta', JSON.stringify(dados));
        alert("Aposta salva localmente!");
    }

    function gamesData() {
        return jogos.map(j => ({
            id: j.id,
            times: document.getElementById(`times-j${j.id}`).value,
            e: document.getElementById(`oddE-j${j.id}`).value,
            v: document.getElementById(`oddV-j${j.id}`).value
        }));
    }

    window.onload = () => {
        renderizarCards();
        const salvo = localStorage.getItem('minhaAposta');
        if(salvo) {
            const d = JSON.parse(salvo);
            document.getElementById('montante').value = d.montante;
            document.getElementById('oddPrincipal').value = d.oddP;
            document.getElementById('metaExtra').value = d.meta;
            d.times.forEach(t => {
                document.getElementById(`times-j${t.id}`).value = t.times;
                document.getElementById(`oddE-j${t.id}`).value = t.e;
                document.getElementById(`oddV-j${t.id}`).value = t.v;
            });
        }
    };
</script>
</body>
</html>
