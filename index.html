<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção Sequencial - Acumulado Real</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; padding: 15px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input { background: #333; color: white; border: 1px solid #555; padding: 8px; width: 100%; margin-top: 5px; }
        .res { font-size: 0.9em; margin-top: 10px; color: #ffeb3b; border-left: 4px solid #ffeb3b; padding-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h3>1. Dados da Múltipla / Aposta Principal</h3>
    <label>Montante Apostado Múltipla (R$):</label>
    <input type="number" id="valM" value="100" oninput="calcular()">
    <label>Margem de Lucro (%):</label>
    <input type="number" id="margem" value="10" oninput="calcular()">
</div>

<div class="card">
    <h3>Proteção 3º Time (Base)</h3>
    <label>Odd Empate:</label><input type="number" id="oddE3" value="12.11" oninput="calcular()">
    <label>Odd Visitante:</label><input type="number" id="oddV3" value="20.65" oninput="calcular()">
    <div id="res3" class="res"></div>
</div>

<div class="card">
    <h3>Proteção 2º Time</h3>
    <label>Odd Empate:</label><input type="number" id="oddE2" value="4.05" oninput="calcular()">
    <label>Odd Visitante:</label><input type="number" id="oddV2" value="6.10" oninput="calcular()">
    <input type="checkbox" id="checkE2" checked onchange="calcular()"> Lucro no Empate
    <input type="checkbox" id="checkV2" checked onchange="calcular()"> Lucro no Visitante
    <div id="res2" class="res"></div>
</div>

<div class="card">
    <h3>Proteção 1º Time</h3>
    <label>Odd Empate:</label><input type="number" id="oddE1" value="3.85" oninput="calcular()">
    <label>Odd Visitante:</label><input type="number" id="oddV1" value="5.80" oninput="calcular()">
    <input type="checkbox" id="checkE1" checked onchange="calcular()"> Lucro no Empate
    <input type="checkbox" id="checkV1" checked onchange="calcular()"> Lucro no Visitante
    <div id="res1" class="res"></div>
</div>

<script>
function calcular() {
    let valM = parseFloat(document.getElementById('valM').value) || 0;
    let margem = (parseFloat(document.getElementById('margem').value) || 0) / 100;
    
    // --- JOGO 3 (Base) ---
    let oE3 = parseFloat(document.getElementById('oddE3').value) || 1;
    let oV3 = parseFloat(document.getElementById('oddV3').value) || 1;
    let aE3 = (valM * (1 + margem)) / oE3 / 2;
    let aV3 = (valM * (1 + margem)) / oV3 / 2;
    let custoJ3 = aE3 + aV3;
    document.getElementById('res3').innerHTML = `Aposta Empate: R$ ${aE3.toFixed(2)} | Aposta Visitante: R$ ${aV3.toFixed(2)}<br>Custo Base J3: R$ ${custoJ3.toFixed(2)}`;

    // --- JOGO 2 (Recupera Múltipla + J3) ---
    let base2 = valM + custoJ3;
    let oE2 = parseFloat(document.getElementById('oddE2').value) || 1;
    let oV2 = parseFloat(document.getElementById('oddV2').value) || 1;
    let cE2 = document.getElementById('checkE2').checked ? (1 + margem) : 1;
    let cV2 = document.getElementById('checkV2').checked ? (1 + margem) : 1;
    let aE2 = (base2 * cE2) / oE2;
    let aV2 = (base2 * cV2) / oV2;
    document.getElementById('res2').innerHTML = 
        `Aposta Empate: R$ ${aE2.toFixed(2)} | Lucro Líquido: R$ ${(aE2*oE2 - base2 - aE2 - aV2).toFixed(2)}<br>` +
        `Aposta Visitante: R$ ${aV2.toFixed(2)} | Lucro Líquido: R$ ${(aV2*oV2 - base2 - aE2 - aV2).toFixed(2)}`;

    // --- JOGO 1 (Recupera Múltipla + J3 + J2) ---
    let base1 = base2 + aE2 + aV2;
    let oE1 = parseFloat(document.getElementById('oddE1').value) || 1;
    let oV1 = parseFloat(document.getElementById('oddV1').value) || 1;
    let cE1 = document.getElementById('checkE1').checked ? (1 + margem) : 1;
    let cV1 = document.getElementById('checkV1').checked ? (1 + margem) : 1;
    let aE1 = (base1 * cE1) / oE1;
    let aV1 = (base1 * cV1) / oV1;
    document.getElementById('res1').innerHTML = 
        `Aposta Empate: R$ ${aE1.toFixed(2)} | Lucro Líquido: R$ ${(aE1*oE1 - base1 - aE1 - aV1).toFixed(2)}<br>` +
        `Aposta Visitante: R$ ${aV1.toFixed(2)} | Lucro Líquido: R$ ${(aV1*oV1 - base1 - aE1 - aV1).toFixed(2)}`;
}
window.onload = calcular;
</script>
</body>
</html>
