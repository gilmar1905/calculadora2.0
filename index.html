<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção Sequencial - Completo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .row { display: flex; gap: 15px; margin-bottom: 10px; }
        .col { flex: 1; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .res { margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 5px solid #2e7d32; font-size: 0.9em; line-height: 1.6; }
        .lucro-positivo { color: green; font-weight: bold; }
        .lucro-negativo { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h3>1. Dados da Múltipla / Aposta Principal</h3>
    <div class="row">
        <div class="col"><label>Montante (R$)</label><input type="number" id="valM" value="100" oninput="calcular()"></div>
        <div class="col"><label>Odd Total</label><input type="number" id="oddM" value="4.13" oninput="calcular()"></div>
    </div>
    <label>Margem de Lucro (%)</label>
    <input type="number" id="margem" value="10" oninput="calcular()">
</div>

<div id="container-jogos">
    <script>
        const jogos = [
            { id: 1, nome: "Brasil x Marrocos", oddE: 3.85, oddV: 5.80 },
            { id: 2, nome: "Bélgica x Egito", oddE: 4.05, oddV: 6.10 },
            { id: 3, nome: "França x Senegal", oddE: 12.11, oddV: 20.65 }
        ];

        jogos.forEach(j => {
            document.write(`
                <div class="card" id="card${j.id}">
                    <h3>Proteção ${j.id}º Time / Jogo:</h3>
                    <input type="text" value="${j.nome}">
                    <div class="row">
                        <div class="col"><label>Odd Empate (X)</label><input type="number" id="oddE${j.id}" value="${j.oddE}" oninput="calcular()"></div>
                        <div class="col"><label>Odd Visitante (2)</label><input type="number" id="oddV${j.id}" value="${j.oddV}" oninput="calcular()"></div>
                    </div>
                    <div id="res${j.id}" class="res">Aguardando...</div>
                </div>
            `);
        });
    </script>
</div>

<script>
    function calcular() {
        let valM = parseFloat(document.getElementById('valM').value) || 0;
        let margem = parseFloat(document.getElementById('margem').value) / 100 || 0;
        
        let odds = [
            { e: parseFloat(document.getElementById('oddE1').value), v: parseFloat(document.getElementById('oddV1').value) },
            { e: parseFloat(document.getElementById('oddE2').value), v: parseFloat(document.getElementById('oddV2').value) },
            { e: parseFloat(document.getElementById('oddE3').value), v: parseFloat(document.getElementById('oddV3').value) }
        ];

        let custoAcumulado = valM;
        let resultados = [];

        for (let i = 2; i >= 0; i--) {
            let totalParaRecuperar = (custoAcumulado * (1 + margem));
            let valE = (totalParaRecuperar / odds[i].e) / 2;
            let valV = (totalParaRecuperar / odds[i].v) / 2;
            
            // Calculando retornos brutos e lucros líquidos
            let retE = valE * odds[i].e;
            let retV = valV * odds[i].v;
            
            resultados[i] = { 
                e: valE, v: valV, 
                retE: retE, retV: retV,
                lucroE: retE - custoAcumulado - valE - valV, // Exemplo simplificado de lógica de lucro
                lucroV: retV - custoAcumulado - valE - valV 
            };
            custoAcumulado += (valE + valV);
        }

        for (let i = 0; i < 3; i++) {
            let res = resultados[i];
            document.getElementById('res' + (i+1)).innerHTML = 
                `⚡ <b>Aposta Empate:</b> R$ ${res.e.toFixed(2)} | <b>Retorno:</b> R$ ${res.retE.toFixed(2)} | <b>Lucro:</b> R$ ${res.lucroE.toFixed(2)}<br>` +
                `⚡ <b>Aposta Visitante:</b> R$ ${res.v.toFixed(2)} | <b>Retorno:</b> R$ ${res.retV.toFixed(2)} | <b>Lucro:</b> R$ ${res.lucroV.toFixed(2)}<br>` +
                `💰 <b>Custo Acumulado Total no momento:</b> R$ ${custoAcumulado.toFixed(2)}`;
        }
    }
    window.onload = calcular;
</script>
</body>
</html>
