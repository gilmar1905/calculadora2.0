<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção Sequencial - Acumulado Real</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; padding: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; border: 1px solid #ccc; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; display: flex; flex-direction: column; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .res { font-size: 0.9rem; margin-top: 10px; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="card">
    <h3>1. Dados da Múltipla / Aposta Principal</h3>
    <label>Montante Apostado Múltipla (R$):</label>
    <input type="number" id="valMultipla" value="100.00" oninput="calcular()">
    <label>Margem de Lucro Cobertura (%):</label>
    <input type="number" id="margem" value="10" oninput="calcular()">
</div>

<div class="card" style="border-left: 5px solid #ffeb3b;">
    <h3>Proteção 3º Time / Jogo:</h3>
    <input type="text" value="França x Senegal" oninput="calcular()">
    <div class="row">
        <div class="col"><label>Odd Empate (X)</label><input type="number" id="oddE3" value="12.11" oninput="calcular()"></div>
        <div class="col"><label>Odd Visitante (2)</label><input type="number" id="oddV3" value="20.65" oninput="calcular()"></div>
    </div>
    <div id="res3" class="res">Aguardando...</div>
</div>

<div class="card" style="border-left: 5px solid #2196f3;">
    <h3>Proteção 2º Time / Jogo:</h3>
    <input type="text" value="Bélgica x Egito" oninput="calcular()">
    <div class="row">
        <div class="col"><label>Odd Empate (X)</label><input type="number" id="oddE2" value="4.05" oninput="calcular()"></div>
        <div class="col"><label>Odd Visitante (2)</label><input type="number" id="oddV2" value="6.10" oninput="calcular()"></div>
    </div>
    <div id="res2" class="res">Aguardando...</div>
</div>

<div class="card" style="border-left: 5px solid #4caf50;">
    <h3>Proteção 1º Time / Jogo:</h3>
    <input type="text" value="Brasil x Marrocos" oninput="calcular()">
    <div class="row">
        <div class="col"><label>Odd Empate (X)</label><input type="number" id="oddE1" value="3.85" oninput="calcular()"></div>
        <div class="col"><label>Odd Visitante (2)</label><input type="number" id="oddV1" value="5.80" oninput="calcular()"></div>
    </div>
    <div id="res1" class="res">Aguardando...</div>
</div>

<script>
    function calcular() {
        let valM = parseFloat(document.getElementById('valMultipla').value) || 0;
        let margem = parseFloat(document.getElementById('margem').value) / 100 || 0;
        
        let odds = [
            { e: parseFloat(document.getElementById('oddE1').value), v: parseFloat(document.getElementById('oddV1').value) },
            { e: parseFloat(document.getElementById('oddE2').value), v: parseFloat(document.getElementById('oddV2').value) },
            { e: parseFloat(document.getElementById('oddE3').value), v: parseFloat(document.getElementById('oddV3').value) }
        ];

        let custoAcumulado = valM;
        let resultados = [];

        // Cálculo de trás para frente (do Jogo 3 para o 1) para já incluir o custo do Jogo 3 no total acumulado
        for (let i = 2; i >= 0; i--) {
            let totalParaRecuperar = custoAcumulado * (1 + margem);
            let valE = (totalParaRecuperar / odds[i].e) / 2;
            let valV = (totalParaRecuperar / odds[i].v) / 2;
            resultados[i] = { e: valE, v: valV };
            custoAcumulado += (valE + valV);
        }

        // Exibir resultados
        for (let i = 0; i < 3; i++) {
            document.getElementById('res' + (i+1)).innerHTML = 
                `Aposta Empate: R$ ${resultados[i].e.toFixed(2)} | Aposta Visitante: R$ ${resultados[i].v.toFixed(2)}<br>` +
                `<b>Custo Acumulado Total:</b> R$ ${custoAcumulado.toFixed(2)}`;
        }
    }
    window.onload = calcular;
</script>
</body>
</html>
