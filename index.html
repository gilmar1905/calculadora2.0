<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção - Soma Acumulada Real</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; }
        .card { background: #111; padding: 15px; border-radius: 5px; border: 1px solid #333; margin-bottom: 20px; }
        input { background: #222; border: 1px solid #444; color: #fff; padding: 8px; width: 100%; box-sizing: border-box; }
        .res { margin-top: 10px; font-size: 0.9em; border-left: 3px solid #00bcd4; padding-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Dados do Ciclo</h3>
    <label>Montante Múltipla (R$):</label><input type="number" id="valM" value="100" oninput="calcular()">
    <label>Odd Total Múltipla:</label><input type="number" id="oddM" value="4.13" oninput="calcular()">
    <label>Margem de Lucro (%):</label><input type="number" id="margem" value="10" oninput="calcular()">
</div>

<script>
    const nomes = ["Brasil x Marrocos", "Bélgica x Egito", "França x Senegal"];
    for(let i=1; i<=3; i++) {
        document.write(`
            <div class="card">
                <h3>Jogo ${i}: ${nomes[i-1]}</h3>
                <label>Odd Empate (X)</label><input type="number" id="oddE${i}" value="3.85" oninput="calcular()">
                <label>Odd Visitante (2)</label><input type="number" id="oddV${i}" value="5.80" oninput="calcular()">
                <input type="checkbox" id="checkE${i}" checked onchange="calcular()"> <label>Lucro no Empate</label>
                <input type="checkbox" id="checkV${i}" checked onchange="calcular()"> <label>Lucro no Visitante</label>
                <div id="res${i}" class="res">Aguardando...</div>
            </div>
        `);
    }
</script>

<script>
    function calcular() {
        let valM = parseFloat(document.getElementById('valM').value) || 0;
        let margem = (parseFloat(document.getElementById('margem').value) || 0) / 100;
        
        let odds = [];
        for(let i=1; i<=3; i++) {
            odds.push({ 
                e: parseFloat(document.getElementById('oddE'+i).value) || 1, 
                v: parseFloat(document.getElementById('oddV'+i).value) || 1,
                cE: document.getElementById('checkE'+i).checked,
                cV: document.getElementById('checkV'+i).checked
            });
        }

        // LÓGICA: O CUSTO TOTAL é a soma da múltipla com todas as apostas de proteção.
        // Como o valor das apostas depende do custo, usamos uma aproximação robusta.
        let apostaE = [0,0,0], apostaV = [0,0,0];
        
        // Iteração para estabilizar o custo total acumulado
        for(let iter = 0; iter < 5; iter++) {
            let totalInvestido = valM + apostaE.reduce((a,b)=>a+b,0) + apostaV.reduce((a,b)=>a+b,0);
            let meta = totalInvestido * (1 + margem);
            
            for(let i=0; i<3; i++) {
                let ativas = (odds[i].cE ? 1 : 0) + (odds[i].cV ? 1 : 0);
                apostaE[i] = odds[i].cE ? (meta / odds[i].e / ativas) : 0;
                apostaV[i] = odds[i].cV ? (meta / odds[i].v / ativas) : 0;
            }
        }

        for(let i=0; i<3; i++) {
            let totalInvestido = valM + apostaE.reduce((a,b)=>a+b,0) + apostaV.reduce((a,b)=>a+b,0);
            document.getElementById('res'+(i+1)).innerHTML = `
                Aposta Empate: <b>R$ ${apostaE[i].toFixed(2)}</b> | Retorno: R$ ${(apostaE[i] * odds[i].e).toFixed(2)}<br>
                Aposta Visitante: <b>R$ ${apostaV[i].toFixed(2)}</b> | Retorno: R$ ${(apostaV[i] * odds[i].v).toFixed(2)}<br>
                Custo Total Acumulado do Ciclo: <b>R$ ${totalInvestido.toFixed(2)}</b>
            `;
        }
    }
    window.onload = calcular;
</script>
</body>
</html>
