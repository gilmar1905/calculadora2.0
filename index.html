<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção 3 Times - Acumulo Total</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; padding: 15px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input { background: #333; color: white; border: 1px solid #555; padding: 8px; width: 100%; margin-top: 5px; }
        .res { font-size: 0.9em; margin-top: 10px; color: #ffeb3b; border-left: 4px solid #ffeb3b; padding-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Dados do Ciclo</h3>
    <label>Montante Múltipla (R$):</label><input type="number" id="valM" value="100" oninput="calcular()">
    <label>Margem de Lucro (%):</label><input type="number" id="margem" value="10" oninput="calcular()">
</div>

<div class="card">
    <h3>Proteção 3º Time (Base)</h3>
    <input type="number" id="oddE3" placeholder="Odd Empate" value="12.11" oninput="calcular()">
    <input type="number" id="oddV3" placeholder="Odd Visitante" value="20.65" oninput="calcular()">
    <div id="res3" class="res"></div>
</div>

<div class="card">
    <h3>Proteção 2º Time</h3>
    <input type="number" id="oddE2" placeholder="Odd Empate" value="4.05" oninput="calcular()">
    <input type="number" id="oddV2" placeholder="Odd Visitante" value="6.10" oninput="calcular()">
    <div id="res2" class="res"></div>
</div>

<div class="card">
    <h3>Proteção 1º Time</h3>
    <input type="number" id="oddE1" placeholder="Odd Empate" value="3.85" oninput="calcular()">
    <input type="number" id="oddV1" placeholder="Odd Visitante" value="5.80" oninput="calcular()">
    <div id="res1" class="res"></div>
</div>

<script>
function calcular() {
    let valM = parseFloat(document.getElementById('valM').value) || 0;
    let margem = (parseFloat(document.getElementById('margem').value) || 0) / 100;
    
    // 1. Cálculo Jogo 3 (Aposta fixa baseada no montante da múltipla)
    let oE3 = parseFloat(document.getElementById('oddE3').value) || 1;
    let oV3 = parseFloat(document.getElementById('oddV3').value) || 1;
    let aE3 = (valM * (1 + margem)) / oE3 / 2;
    let aV3 = (valM * (1 + margem)) / oV3 / 2;
    document.getElementById('res3').innerHTML = `Aposta Empate: R$ ${aE3.toFixed(2)} | Aposta Visitante: R$ ${aV3.toFixed(2)}<br>Custo J3: R$ ${(aE3+aV3).toFixed(2)}`;

    // 2. Cálculo Jogo 2 (Recupera Múltipla + Jogo 3)
    let custoAcumulado2 = valM + (aE3 + aV3);
    let oE2 = parseFloat(document.getElementById('oddE2').value) || 1;
    let oV2 = parseFloat(document.getElementById('oddV2').value) || 1;
    let aE2 = (custoAcumulado2 * (1 + margem)) / oE2 / 2;
    let aV2 = (custoAcumulado2 * (1 + margem)) / oV2 / 2;
    document.getElementById('res2').innerHTML = `Aposta Empate: R$ ${aE2.toFixed(2)} | Aposta Visitante: R$ ${aV2.toFixed(2)}<br>Custo Total Acumulado: R$ ${(custoAcumulado2 + aE2 + aV2).toFixed(2)}`;

    // 3. Cálculo Jogo 1 (Recupera Múltipla + Jogo 3 + Jogo 2)
    let custoAcumulado1 = custoAcumulado2 + (aE2 + aV2);
    let oE1 = parseFloat(document.getElementById('oddE1').value) || 1;
    let oV1 = parseFloat(document.getElementById('oddV1').value) || 1;
    let aE1 = (custoAcumulado1 * (1 + margem)) / oE1 / 2;
    let aV1 = (custoAcumulado1 * (1 + margem)) / oV1 / 2;
    document.getElementById('res1').innerHTML = `Aposta Empate: R$ ${aE1.toFixed(2)} | Aposta Visitante: R$ ${aV1.toFixed(2)}<br>Custo Total Acumulado: R$ ${(custoAcumulado1 + aE1 + aV1).toFixed(2)}`;
}
window.onload = calcular;
</script>
</body>
</html>
