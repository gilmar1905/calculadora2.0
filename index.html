<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção Sequencial</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        input { padding: 8px; width: 100%; margin-bottom: 5px; background: #333; color: #fff; border: 1px solid #444; }
        .res { padding: 10px; background: #263238; margin-top: 10px; font-size: 0.85rem; border-radius: 4px; border-left: 4px solid #4caf50; }
    </style>
</head>
<body>

<div class="card">
    <h3>1. Dados da Múltipla / Aposta Principal</h3>
    <label>Montante Apostado Múltipla (R$):</label>
    <input type="number" id="valM" value="100" oninput="calcular()">
    <label>Odd Total Acumulada:</label>
    <input type="number" id="oddM" value="4.13" oninput="calcular()">
    <label>Margem de Lucro Cobertura (%):</label>
    <input type="number" id="margem" value="10" oninput="calcular()">
    <div><strong>Retorno Bruto Múltipla: R$ <span id="retM">0.00</span></strong></div>
</div>

<script>
    const nomesJogos = ["Brasil x Marrocos", "Bélgica x Egito", "França x Senegal"];
    for(let i=1; i<=3; i++) {
        document.write(`
            <div class="card">
                <h3>Proteção ${i}º Time / Jogo:</h3>
                <input type="text" value="${nomesJogos[i-1]}">
                <label>Odd Empate (X)</label><input type="number" id="oddE${i}" value="3.85" oninput="calcular()">
                <label>Odd Visitante (2)</label><input type="number" id="oddV${i}" value="5.80" oninput="calcular()">
                <label><input type="checkbox" id="checkE${i}" checked onchange="calcular()"> Aplicar lucro no Empate</label>
                <label><input type="checkbox" id="checkV${i}" checked onchange="calcular()"> Aplicar lucro no Visitante</label>
                <div id="res${i}" class="res">Aguardando...</div>
            </div>
        `);
    }
</script>

<script>
    function calcular() {
        let valM = parseFloat(document.getElementById('valM').value) || 0;
        let oddM = parseFloat(document.getElementById('oddM').value) || 0;
        let margem = (parseFloat(document.getElementById('margem').value) || 0) / 100;
        
        document.getElementById('retM').innerText = (valM * oddM).toFixed(2);
        
        let custoAcumulado = valM; 
        
        for(let i=1; i<=3; i++) {
            let oddE = parseFloat(document.getElementById('oddE'+i).value) || 1;
            let oddV = parseFloat(document.getElementById('oddV'+i).value) || 1;
            let checkE = document.getElementById('checkE'+i).checked;
            let checkV = document.getElementById('checkV'+i).checked;

            let metaE = checkE ? (custoAcumulado * (1 + margem)) : custoAcumulado;
            let metaV = checkV ? (custoAcumulado * (1 + margem)) : custoAcumulado;

            let apostaE = metaE / oddE;
            let apostaV = metaV / oddV;

            document.getElementById('res'+i).innerHTML = `
                ⚡ <b>Aposta Empate:</b> R$ ${apostaE.toFixed(2)} | <b>Retorno:</b> R$ ${(apostaE * oddE).toFixed(2)} | <b>Lucro:</b> R$ ${(apostaE * oddE - custoAcumulado - apostaE - apostaV).toFixed(2)}<br>
                ⚡ <b>Aposta Visitante:</b> R$ ${apostaV.toFixed(2)} | <b>Retorno:</b> R$ ${(apostaV * oddV).toFixed(2)} | <b>Lucro:</b> R$ ${(apostaV * oddV - custoAcumulado - apostaE - apostaV).toFixed(2)}<br>
                💰 <b>Custo Acumulado Total:</b> R$ ${custoAcumulado.toFixed(2)}
            `;
            custoAcumulado += (apostaE + apostaV);
        }
    }
    window.onload = calcular;
</script>
</body>
</html>
