<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção Sequencial - Correção Lógica</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; }
        .card { background: #111; padding: 15px; border-radius: 5px; border: 1px solid #333; margin-bottom: 20px; }
        input { background: #222; border: 1px solid #444; color: #fff; padding: 8px; width: 100%; box-sizing: border-box; }
        .res { margin-top: 10px; font-size: 0.9em; border-left: 3px solid #00bcd4; padding-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h3>1. Dados da Múltipla / Aposta Principal</h3>
    <label>Montante (R$):</label><input type="number" id="valM" value="100" oninput="calcular()">
    <label>Odd Total:</label><input type="number" id="oddM" value="4.13" oninput="calcular()">
    <label>Margem de Lucro (%):</label><input type="number" id="margem" value="10" oninput="calcular()">
    <p>Retorno bruto múltipla: R$ <span id="retM">413.00</span></p>
</div>

<script>
    const nomes = ["Brasil x Marrocos", "Bélgica x Egito", "França x Senegal"];
    for(let i=1; i<=3; i++) {
        document.write(`
            <div class="card">
                <h3>Proteção ${i}º Time / Jogo:</h3>
                <input type="text" value="${nomes[i-1]}">
                <label>Odd Empate (X)</label><input type="number" id="oddE${i}" value="3.85" oninput="calcular()">
                <label>Odd Visitante (2)</label><input type="number" id="oddV${i}" value="5.80" oninput="calcular()">
                <br><br>
                <input type="checkbox" id="checkE${i}" checked onchange="calcular()"> <label>Aplicar Lucro no Empate</label><br>
                <input type="checkbox" id="checkV${i}" checked onchange="calcular()"> <label>Aplicar Lucro no Visitante</label>
                <div id="res${i}" class="res">Aguardando...</div>
            </div>
        `);
    }
</script>

<script>
    function calcular() {
        let valM = parseFloat(document.getElementById('valM').value) || 0;
        let oddM = parseFloat(document.getElementById('oddM').value) || 1;
        let margem = (parseFloat(document.getElementById('margem').value) || 0) / 100;
        document.getElementById('retM').innerText = (valM * oddM).toFixed(2);

        // A LÓGICA: O custo do Jogo 3 é obrigatório ser somado ao custo inicial.
        // Simulamos a antecipação como o custo base necessário para o Jogo 3 (baseado na sua necessidade).
        // Aqui assumimos que o sistema deve forçar a recuperação deste custo.
        let custoAcumulado = valM; 

        for(let i=1; i<=3; i++) {
            let oE = parseFloat(document.getElementById('oddE'+i).value) || 1;
            let oV = parseFloat(document.getElementById('oddV'+i).value) || 1;
            let cE = document.getElementById('checkE'+i).checked;
            let cV = document.getElementById('checkV'+i).checked;

            // Meta = Custo acumulado + margem (se checkbox marcado)
            let metaE = cE ? (custoAcumulado * (1 + margem)) : custoAcumulado;
            let metaV = cV ? (custoAcumulado * (1 + margem)) : custoAcumulado;

            let aE = metaE / oE;
            let aV = metaV / oV;

            document.getElementById('res'+i).innerHTML = `
                Aposta Empate: R$ ${aE.toFixed(2)} | Retorno: R$ ${(aE * oE).toFixed(2)} | Lucro: R$ ${(aE * oE - custoAcumulado - aE - aV).toFixed(2)}<br>
                Aposta Visitante: R$ ${aV.toFixed(2)} | Retorno: R$ ${(aV * oV).toFixed(2)} | Lucro: R$ ${(aV * oV - custoAcumulado - aE - aV).toFixed(2)}<br>
                <b>Custo Acumulado Total: R$ ${custoAcumulado.toFixed(2)}</b>
            `;
            
            // O custo do próximo jogo soma o que foi apostado neste
            custoAcumulado += (aE + aV);
        }
    }
    window.onload = calcular;
</script>
</body>
</html>
