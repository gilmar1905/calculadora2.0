<script>
function calcular() {
    // 1. Captura dos valores iniciais
    let valM = parseFloat(document.getElementById('valM').value) || 0;
    let margem = (parseFloat(document.getElementById('margem').value) || 0) / 100;
    
    // Arrays para guardar as apostas que calcularemos
    let aE = [0, 0, 0];
    let aV = [0, 0, 0];
    
    // 2. Loop de estabilização do cálculo (Garante que a soma de tudo seja considerada)
    // Usamos um loop simples para que as apostas de um jogo "enxerguem" o gasto do anterior
    for(let iter = 0; iter < 5; iter++) {
        // Custo Total = Múltipla + Soma das apostas feitas em todos os 3 jogos
        let totalInvestido = valM + aE.reduce((a,b)=>a+b,0) + aV.reduce((a,b)=>a+b,0);
        let meta = totalInvestido * (1 + margem);
        
        for(let i = 0; i < 3; i++) {
            let id = i + 1;
            let oE = parseFloat(document.getElementById('oddE' + id).value) || 1;
            let oV = parseFloat(document.getElementById('oddV' + id).value) || 1;
            let cE = document.getElementById('checkE' + id).checked;
            let cV = document.getElementById('checkV' + id).checked;
            let ativas = (cE ? 1 : 0) + (cV ? 1 : 0);
            
            // Aposta necessária para atingir a meta naquele cenário
            aE[i] = cE ? (meta / oE / ativas) : 0;
            aV[i] = cV ? (meta / oV / ativas) : 0;
        }
    }

    // 3. Exibição dos resultados (Mantendo exatamente seu layout)
    for(let i = 1; i <= 3; i++) {
        let totalInvestido = valM + aE.reduce((a,b)=>a+b,0) + aV.reduce((a,b)=>a+b,0);
        
        document.getElementById('res' + i).innerHTML = 
            `Aposta no EMPATE: R$ ${aE[i-1].toFixed(2)} (Odd: ${document.getElementById('oddE'+i).value}) - Retorno: R$ ${(aE[i-1] * document.getElementById('oddE'+i).value).toFixed(2)}<br>` +
            `Aposta no VISITANTE: R$ ${aV[i-1].toFixed(2)} (Odd: ${document.getElementById('oddV'+i).value}) - Retorno: R$ ${(aV[i-1] * document.getElementById('oddV'+i).value).toFixed(2)}<br>` +
            `<b>Custo Acumulado Total: R$ ${totalInvestido.toFixed(2)}</b>`;
    }
}
</script>
