<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Proteção Sequencial - Acumulado Real</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; padding: 15px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input { background: #333; color: white; border: 1px solid #555; padding: 8px; width: 100%; margin-top: 5px; }
        .res { font-size: 0.9em; margin-top: 10px; color: #ffeb3b; border-left: 4px solid #ffeb3b; padding-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Dados do Ciclo</h3>
    <label>Montante Múltipla (R$):</label><input type="number" id="valM" value="100" oninput="calcular()">
    <label>Custo Fixo Jogo 3 (R$):</label><input type="number" id="custoJ3" value="50" oninput="calcular()">
    <label>Margem de Lucro (%):</label><input type="number" id="margem" value="10" oninput="calcular()">
</div>

<div class="card">
    <h3>Proteção 1º Time</h3>
    <label>Odd Empate:</label><input type="number" id="oddE1" value="3.85" oninput="calcular()">
    <label>Odd Visitante:</label><input type="number" id="oddV1" value="5.80" oninput="calcular()">
    <input type="checkbox" id="checkE1" checked onchange="calcular()"> Lucro no Empate
    <input type="checkbox" id="checkV1" checked onchange="calcular()"> Lucro no Visitante
    <div id="res1" class="res"></div>
</div>

<div class="card">
    <h3>Proteção 2º Time</h3>
    <label>Odd Empate:</label><input type="number" id="oddE2" value="4.05" oninput="calcular()">
    <label>Odd Visitante:</label><input type="number" id="oddV2" value="6.10" oninput="calcular()">
    <input type="checkbox" id="checkE2" checked onchange="calcular()"> Lucro no Empate
    <input type="checkbox" id="checkV2" checked onchange="calcular()"> Lucro no Visitante
    <div id="res2" class="res"></div>
</div>

<div class="card">
    <h3>Proteção 3º Time</h3>
    <label>Odd Empate:</label><input type="number" id="oddE3" value="12.11" oninput="calcular()">
    <label>Odd Visitante:</label><input type="number" id="oddV3" value="20.65" oninput="calcular()">
    <input type="checkbox" id="checkE3" checked onchange="calcular()"> Lucro no Empate
    <input type="checkbox" id="checkV3" checked onchange="calcular()"> Lucro no Visitante
    <div id="res3" class="res"></div>
</div>

<script>
function calcular() {
    let valM = parseFloat(document.getElementById('valM').value) || 0;
    let custoJ3 = parseFloat(document.getElementById('custoJ3').value) || 0;
    let margem = (parseFloat(document.getElementById('margem').value) || 0) / 100;

    // Cálculo sequencial acumulado
    let base = valM + custoJ3;
    let apostas = [];

    // Loop para Jogo 1, 2 e 3
    for(let i = 1; i <= 3; i++) {
        let oE = parseFloat(document.getElementById('oddE'+i).value) || 1;
        let oV = parseFloat(document.getElementById('oddV'+i).value) || 1;
        let cE_ativa = document.getElementById('checkE'+i).checked;
        let cV_ativa = document.getElementById('checkV'+i).checked;
        
        // Multiplicador de lucro (se marcado, aplica margem; se não, zera o custo)
        let mulE = cE_ativa ? (1 + margem) : 1;
        let mulV = cV_ativa ? (1 + margem) : 1;
        let ativas = (cE_ativa ? 1 : 0) + (cV_ativa ? 1 : 0);

        let aE = cE_ativa ? (base * mulE / oE / ativas) : 0;
        let aV = cV_ativa ? (base * mulV / oV / ativas) : 0;

        document.getElementById('res'+i).innerHTML = 
            `Aposta Empate: R$ ${aE.toFixed(2)} | Aposta Visitante: R$ ${aV.toFixed(2)}<br>` +
            `Custo Acumulado Total: R$ ${(base + aE + aV).toFixed(2)}`;

        // O custo base para o próximo jogo é o atual + apostas deste jogo
        base += (aE + aV);
        apostas.push({aE, aV});
    }
}
window.onload = calcular;
</script>
</body>
</html>
